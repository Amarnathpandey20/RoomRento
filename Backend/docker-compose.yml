version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: room_rento_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/room_rento
      - JWT_ACCESS_SECRET=docker_production_jwt_access_secret_super_secure_32chars
      - JWT_REFRESH_SECRET=docker_production_jwt_refresh_secret_super_secure_32chars
      - FRONTEND_URL=http://localhost:5173
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - room_rento_net

  mongo:
    image: mongo:7.0
    container_name: room_rento_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - room_rento_net

  mongo-express:
    image: mongo-express:latest
    container_name: room_rento_mongo_express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongo
    networks:
      - room_rento_net

networks:
  room_rento_net:
    driver: bridge

volumes:
  mongo_data:
