<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Host Enquiries & Messaging • RoomRento</title>
  <meta name="description" content="Chat directly with verified room hosts, clarify questions, and schedule free room visits.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="flex items-center gap-3">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">
            <span class="material-symbols-outlined">home_work</span>
          </div>
          <span>RoomRento</span>
        </a>
      </div>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">
          <span class="material-symbols-outlined" style="font-size:18px;">explore</span>
          Explore
        </a>
        <a href="compare.html" class="nav-link">
          <span class="material-symbols-outlined" style="font-size:18px;">compare_arrows</span>
          Compare
          <span class="badge-count compare-count-badge" style="display:none;">0</span>
        </a>
        <a href="saved.html" class="nav-link">
          <span class="material-symbols-outlined" style="font-size:18px;">favorite</span>
          Saved
          <span class="badge-count saved-count-badge" style="display:none;">0</span>
        </a>
        <a href="enquiries.html" class="nav-link active">
          <span class="material-symbols-outlined" style="font-size:18px;">chat</span>
          Enquiries
        </a>
      </nav>

      <div class="header-actions">
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Theme">
          <span class="material-symbols-outlined">dark_mode</span>
        </button>
        <div id="header-user-slot"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="chat-layout">
      <!-- Left: Conversations List -->
      <aside class="chat-sidebar">
        <div style="padding:1rem;border-bottom:1px solid var(--border);background:var(--surface-dim);">
          <h2 style="font-size:1.1rem;font-weight:800;">Host Conversations</h2>
          <p style="font-size:0.75rem;color:var(--text-muted);">Direct message threads with verified property owners</p>
        </div>
        <div id="chat-thread-list" class="chat-thread-list"></div>
      </aside>

      <!-- Right: Active Chat Thread -->
      <section class="chat-main">
        <div id="chat-active-header" style="padding:0.85rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);"></div>

        <div id="chat-messages" class="chat-messages"></div>

        <!-- Quick Query Chips -->
        <div style="padding:0.4rem 1rem;background:var(--surface-dim);display:flex;gap:0.5rem;overflow-x:auto;">
          <button class="chip chat-quick-chip" style="font-size:0.75rem;padding:3px 10px;">Is this room available immediately?</button>
          <button class="chip chat-quick-chip" style="font-size:0.75rem;padding:3px 10px;">Can I schedule a visit tomorrow at 5 PM?</button>
          <button class="chip chat-quick-chip" style="font-size:0.75rem;padding:3px 10px;">Are all utilities and Wi-Fi included?</button>
        </div>

        <!-- Send Form -->
        <form id="chat-send-form" class="chat-input-bar">
          <input type="text" id="chat-msg-input" placeholder="Type your message to the host..." autocomplete="off">
          <button type="submit" class="btn-primary" style="padding:0.65rem 1.25rem;border-radius:var(--radius-full);">
            <span class="material-symbols-outlined" style="font-size:18px;">send</span>
            <span>Send</span>
          </button>
        </form>
      </section>
    </div>
  </main>

  <!-- Schedule Visit Modal -->
  <div id="schedule-visit-modal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h3 class="modal-title">Schedule Free Room Visit</h3>
          <p id="modal-visit-property-title" style="font-size:0.82rem;color:var(--text-muted);"></p>
        </div>
        <button class="modal-close-btn" onclick="closeModal('schedule-visit-modal')">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <form id="schedule-visit-form">
          <input type="hidden" id="modal-visit-property-id">
          
          <div style="margin-bottom:1.25rem;">
            <label style="display:block;font-weight:700;font-size:0.88rem;margin-bottom:0.4rem;">Select Date</label>
            <input type="date" id="visit-date-input" required style="width:100%;padding:0.65rem;border:1px solid var(--border);border-radius:var(--radius-md);outline:none;background:var(--surface-dim);color:var(--text-main);">
          </div>

          <div style="margin-bottom:1.25rem;">
            <label style="display:block;font-weight:700;font-size:0.88rem;margin-bottom:0.4rem;">Preferred Time Slot</label>
            <div style="display:flex;flex-direction:column;gap:0.5rem;">
              <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;cursor:pointer;">
                <input type="radio" name="visit-slot" value="Morning (10:00 AM - 1:00 PM)" checked style="accent-color:var(--primary);">
                Morning (10:00 AM - 1:00 PM)
              </label>
              <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;cursor:pointer;">
                <input type="radio" name="visit-slot" value="Afternoon (1:00 PM - 5:00 PM)" style="accent-color:var(--primary);">
                Afternoon (1:00 PM - 5:00 PM)
              </label>
              <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;cursor:pointer;">
                <input type="radio" name="visit-slot" value="Evening (5:00 PM - 8:00 PM)" style="accent-color:var(--primary);">
                Evening (5:00 PM - 8:00 PM)
              </label>
            </div>
          </div>

          <div style="margin-bottom:1.5rem;">
            <label style="display:block;font-weight:700;font-size:0.88rem;margin-bottom:0.4rem;">Contact Phone Number</label>
            <input type="tel" id="visit-phone-input" value="+91 98123 45678" required style="width:100%;padding:0.65rem;border:1px solid var(--border);border-radius:var(--radius-md);outline:none;background:var(--surface-dim);color:var(--text-main);">
          </div>

          <button type="submit" class="btn-primary" style="width:100%;padding:0.75rem;">
            Confirm Free Visit
          </button>
        </form>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="bottom-tab-item">
      <span class="material-symbols-outlined">explore</span>
      <span>Explore</span>
    </a>
    <a href="compare.html" class="bottom-tab-item">
      <span class="material-symbols-outlined">compare_arrows</span>
      <span>Compare</span>
      <span class="badge-count compare-count-badge" style="display:none;">0</span>
    </a>
    <a href="saved.html" class="bottom-tab-item">
      <span class="material-symbols-outlined">favorite</span>
      <span>Saved</span>
      <span class="badge-count saved-count-badge" style="display:none;">0</span>
    </a>
    <a href="enquiries.html" class="bottom-tab-item active">
      <span class="material-symbols-outlined">chat</span>
      <span>Enquiries</span>
    </a>
    <a href="account.html" class="bottom-tab-item">
      <span class="material-symbols-outlined">person</span>
      <span>Account</span>
    </a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/enquiries.js"></script>
</body>
</html>
